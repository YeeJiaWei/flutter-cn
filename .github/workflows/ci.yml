name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: dart pub get
        working-directory: cli
        run: dart pub get
      - name: dart analyze
        working-directory: cli
        run: dart analyze
      - name: dart test
        working-directory: cli
        run: dart test
      - name: fcn docs --check
        working-directory: cli
        run: dart run bin/fcn.dart docs --check --source ..

  widgetbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: widgetbook
        run: flutter pub get
      - name: flutter analyze
        working-directory: widgetbook
        run: flutter analyze
      - name: flutter build web
        working-directory: widgetbook
        run: flutter build web

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: dart pub get
        working-directory: cli
        run: dart pub get
      - name: dart test
        working-directory: cli
        run: dart test
