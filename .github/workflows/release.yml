name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true
        type: string

jobs:
  check-version:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag must match cli/pubspec.yaml version
        run: |
          tag_version="${TAG#v}"
          pubspec_version="$(grep -m1 '^version:' cli/pubspec.yaml | sed 's/version:[[:space:]]*//')"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $TAG (version $tag_version) does not match cli/pubspec.yaml version $pubspec_version"
            exit 1
          fi

  build:
    needs: check-version
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: fcn-macos-arm64
          - os: macos-15-intel
            asset: fcn-macos-x64
          - os: ubuntu-latest
            asset: fcn-linux-x64
          - os: windows-latest
            asset: fcn-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: dart pub get
        working-directory: cli
        run: dart pub get
      - name: dart analyze
        working-directory: cli
        run: dart analyze
      - name: dart test
        working-directory: cli
        run: dart test
      - name: Compile ${{ matrix.asset }}
        working-directory: cli
        run: dart compile exe bin/fcn.dart -DFCN_VERSION=$TAG -o ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts and write checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/*
          generate_release_notes: true
